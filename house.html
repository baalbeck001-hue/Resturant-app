<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>House & Personal Accounting</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --danger: #dc2626;
      --navy: #1e293b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #475569;
      --border: #cbd5e1;
      --radius: 12px;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 14px;
      padding-bottom: 50px;
      color: var(--text);
    }
    .header {
      text-align: center;
      padding: 10px 0 16px;
      font-weight: 800;
      font-size: 20px;
      color: var(--navy);
      letter-spacing: -0.3px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 14px;
    }
    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: var(--radius);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    h3 {
      margin: 0 0 12px 0;
      color: var(--navy);
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
    }
    label {
      font-size: 11px;
      color: var(--subtext);
      font-weight: 700;
      margin-top: 8px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 11px 14px;
      margin-top: 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #ffffff;
      font-weight: 600;
      color: var(--text);
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 2px rgba(30, 41, 59, 0.1);
    }
    
    .expense-quick-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      margin-bottom: 8px;
      max-height: 140px;
      overflow-y: auto;
      padding: 8px;
      background: #f1f5f9;
      border-radius: 10px;
      border: 1px solid var(--border);
      direction: rtl;
    }
    .exp-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .exp-btn:active {
      background: #e2e8f0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .stat {
      text-align: center;
      padding: 12px 8px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
    }
    .stat-title {
      font-size: 11px;
      color: var(--subtext);
      font-weight: 700;
      text-transform: uppercase;
    }
    .stat-usd {
      font-size: 16px;
      font-weight: 900;
      margin-top: 4px;
    }
    .stat-lbp {
      font-size: 11px;
      color: var(--subtext);
      font-weight: 800;
      margin-top: 2px;
    }
    .income { color: var(--primary); }
    .expense { color: var(--danger); }

    .report-box {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 10px;
      margin-top: 8px;
      max-height: 280px;
      overflow-y: auto;
    }
    .report-item-compact {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding: 10px 6px;
      font-size: 13px;
    }
    .report-item-compact:last-child {
      border-bottom: none;
    }

    .rate-box {
      background: #fffbe3;
      border: 1px solid #fde047;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      color: #713f12;
    }
    .rate-box input {
      width: 100px;
      padding: 6px 10px;
      font-size: 13px;
      text-align: center;
      margin: 0;
      background: #ffffff;
    }
    
    .btn-save-income {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      margin-top: 12px;
      cursor: pointer;
    }
    .btn-save-exp {
      width: 100%;
      padding: 12px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      margin-top: 12px;
      cursor: pointer;
    }
    .btn-wa {
      width: 100%;
      padding: 12px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      margin-top: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .link-btn {
      text-align: center;
      margin-bottom: 14px;
    }
    .link-btn a {
      color: var(--primary);
      font-weight: bold;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="header">🏠 House & Personal Accounting</div>

  <div class="link-btn">
    <a href="index.html">← Go back to Restaurant POS</a>
  </div>

  <div class="rate-box">
    <span>Exchange Rate ($1 = LBP):</span>
    <input type="text" id="exchange-rate" value="90000" onchange="loadHouseData()">
  </div>

  <!-- 🟢 ADD HOUSE INCOME (قبض مصاري) -->
  <div class="card" style="border-color: #a7f3d0; background: #f0fdf4;">
    <h3 style="color: #047857;">💰 Add House Income (قبض)</h3>
    
    <label>Quick Income Buttons:</label>
    <div class="expense-quick-grid" style="background:#e6f4ea;">
      <button class="exp-btn" onclick="setIncomeItem('راتب / دخل')">راتب</button>
      <button class="exp-btn" onclick="setIncomeItem('سلفة قابضة')">سلفة</button>
      <button class="exp-btn" onclick="setIncomeItem('قبض إضافي')">قبض إضافي</button>
      <button class="exp-btn" onclick="setIncomeItem('تحويل من المطعم')">تحويل من المطعم</button>
    </div>

    <label>Income Details:</label>
    <input type="text" id="income-notes" placeholder="Select above or type details...">

    <div class="row" style="display:flex; gap:8px; margin-top:8px;">
      <div style="flex:1;">
        <label>Amount</label>
        <input type="text" id="income-amount" placeholder="0" oninput="fixNumbers(this)">
      </div>
      <div style="flex:1;">
        <label>Currency</label>
        <select id="income-currency">
          <option value="LBP">LBP (ليرة)</option>
          <option value="USD">USD ($)</option>
        </select>
      </div>
    </div>

    <button class="btn-save-income" onclick="saveHouseIncome()">✅ Save Income (تسجيل قبض)</button>
  </div>

  <!-- 🔴 ADD HOUSE EXPENSE (صرف مصاري) -->
  <div class="card" style="border-color: #fecaca; background: #fef2f2;">
    <h3 style="color: #dc2626;">💸 Add House Expense (صرف)</h3>
    
    <label>Quick Expense Buttons:</label>
    <div class="expense-quick-grid" style="background:#fde8e8;">
      <button class="exp-btn" onclick="setExpenseItem('مصروف بيت')">مصروف بيت</button>
      <button class="exp-btn" onclick="setExpenseItem('كهرباء')">كهرباء</button>
      <button class="exp-btn" onclick="setExpenseItem('مياه بيت')">مياه بيت</button>
      <button class="exp-btn" onclick="setExpenseItem('سوبرماركت')">سوبرماركت</button>
      <button class="exp-btn" onclick="setExpenseItem('لحم ودجاج')">لحم ودجاج</button>
      <button class="exp-btn" onclick="setExpenseItem('خضار بيت')">خضار بيت</button>
      <button class="exp-btn" onclick="setExpenseItem('دواء وصحة')">دواء وصحة</button>
      <button class="exp-btn" onclick="setExpenseItem('بنزين سيارة')">بنزين سيارة</button>
      <button class="exp-btn" onclick="setExpenseItem('إنترنت بيت')">إنترنت بيت</button>
      <button class="exp-btn" onclick="setExpenseItem('أجار بيت')">أجار بيت</button>
      <button class="exp-btn" onclick="setExpenseItem('مصروف شخصي')">مصروف شخصي</button>
      <button class="exp-btn" onclick="setExpenseItem('طلبات طفلة')">طلبات طفلة</button>
    </div>

    <label>Expense Details:</label>
    <input type="text" id="expense-notes" placeholder="Select above or type details...">

    <div class="row" style="display:flex; gap:8px; margin-top:8px;">
      <div style="flex:1;">
        <label>Amount</label>
        <input type="text" id="expense-amount" placeholder="0" oninput="fixNumbers(this)">
      </div>
      <div style="flex:1;">
        <label>Currency</label>
        <select id="expense-currency">
          <option value="LBP">LBP (ليرة)</option>
          <option value="USD">USD ($)</option>
        </select>
      </div>
    </div>

    <button class="btn-save-exp" onclick="saveHouseExpense()">💾 Save Expense (تسجيل مصروف)</button>
  </div>

  <!-- 📊 HOUSE SUMMARY -->
  <div class="card">
    <h3>📊 House Daily & Monthly Summary</h3>
    <div class="grid">
      <div class="stat">
        <div class="stat-title">Total Income (قبض)</div>
        <div id="house-inc-usd" class="stat-usd income">$0</div>
        <div id="house-inc-lbp" class="stat-lbp">0 LBP</div>
      </div>
      <div class="stat">
        <div class="stat-title">Total Expenses (صرف)</div>
        <div id="house-exp-usd" class="stat-usd expense">$0</div>
        <div id="house-exp-lbp" class="stat-lbp">0 LBP</div>
      </div>
    </div>
    
    <div class="stat" style="margin-top: 10px; background: #ecfdf5; border-color: #a7f3d0;">
      <div class="stat-title" style="color:#047857; font-weight:bold;">💵 Net House Balance (الصافي الباقي)</div>
      <div id="house-net-usd" class="stat-usd" style="font-size:18px;">$0</div>
      <div id="house-net-lbp" class="stat-lbp" style="font-size:12px; font-weight:800;">0 LBP</div>
    </div>

    <div id="house-report" class="report-box" style="margin-top: 12px;">
      Loading house records...
    </div>

    <button class="btn-wa" onclick="shareHouseWhatsApp()">📲 Send House Report via WhatsApp</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://yjymshmonfhdfjegszbp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_27rFxO5kcSht7s6befLZOg_meB3MQsy';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let globalHouseData = [];

    function fixNumbers(inputElem) {
      let str = inputElem.value;
      const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
      for (let i = 0; i < 10; i++) {
        str = str.replace(new RegExp(arabicDigits[i], 'g'), i);
      }
      inputElem.value = str;
    }

    function parseArabicNumber(val) {
      if (!val) return 0;
      let str = String(val);
      const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
      for (let i = 0; i < 10; i++) {
        str = str.replace(new RegExp(arabicDigits[i], 'g'), i);
      }
      return parseFloat(str) || 0;
    }

    function setIncomeItem(itemName) {
      document.getElementById('income-notes').value = itemName;
      document.getElementById('income-amount').focus();
    }

    function setExpenseItem(itemName) {
      document.getElementById('expense-notes').value = itemName;
      document.getElementById('expense-amount').focus();
    }

    async function saveHouseIncome() {
      const amountVal = parseArabicNumber(document.getElementById('income-amount').value);
      const currency = document.getElementById('income-currency').value;
      const notes = document.getElementById('income-notes').value || 'House Income';
      const rate = parseArabicNumber(document.getElementById('exchange-rate').value) || 90000;

      if (!amountVal || amountVal <= 0) {
        alert('Please enter a valid amount!');
        return;
      }

      let amountUSD = currency === 'USD' ? amountVal : (amountVal / rate);
      const d = new Date();
      const todayFormatted = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

      const { error } = await supabaseClient
        .from('house_expenses')
        .insert([{ 
          entry_date: todayFormatted, 
          category: 'income', 
          amount: amountUSD, 
          notes: `${notes} (${amountVal} ${currency})` 
        }]);

      if (error) {
        alert('Error: ' + error.message);
      } else {
        alert('Income saved successfully! ✅');
        document.getElementById('income-amount').value = '';
        document.getElementById('income-notes').value = '';
        loadHouseData();
      }
    }

    async function saveHouseExpense() {
      const amountVal = parseArabicNumber(document.getElementById('expense-amount').value);
      const currency = document.getElementById('expense-currency').value;
      const notes = document.getElementById('expense-notes').value || 'House Expense';
      const rate = parseArabicNumber(document.getElementById('exchange-rate').value) || 90000;

      if (!amountVal || amountVal <= 0) {
        alert('Please enter a valid amount!');
        return;
      }

      let amountUSD = currency === 'USD' ? amountVal : (amountVal / rate);
      const d = new Date();
      const todayFormatted = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

      const { error } = await supabaseClient
        .from('house_expenses')
        .insert([{ 
          entry_date: todayFormatted, 
          category: 'expense', 
          amount: amountUSD, 
          notes: `${notes} (${amountVal} ${currency})` 
        }]);

      if (error) {
        alert('Error: ' + error.message);
      } else {
        alert('Expense saved successfully! ✅');
        document.getElementById('expense-amount').value = '';
        document.getElementById('expense-notes').value = '';
        loadHouseData();
      }
    }

    async function loadHouseData() {
      const rate = parseArabicNumber(document.getElementById('exchange-rate').value) || 90000;
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      
      const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];

      const { data, error } = await supabaseClient
        .from('house_expenses')
        .select('*')
        .gte('entry_date', firstDay)
        .lte('entry_date', lastDay)
        .order('id', { ascending: false });

      if (error) {
        document.getElementById('house-report').innerHTML = 'Error loading house data.';
        return;
      }

      let tInc = 0, tExp = 0;
      let todayHtml = '';
      globalHouseData = data || [];

      globalHouseData.forEach(item => {
        if (item.entry_date === todayStr) {
          const amtUSD = Number(item.amount);
          const isIncome = item.category === 'income';
          
          if (isIncome) tInc += amtUSD;
          else tExp += amtUSD;

          const lbpVal = Math.round(amtUSD * rate).toLocaleString();
          const sign = isIncome ? '+' : '-';
          const colorClass = isIncome ? 'income' : 'expense';

          todayHtml += `
            <div class="report-item-compact">
              <div><strong>📌 ${item.notes}</strong></div>
              <div style="text-align:right; font-weight:bold;" class="${colorClass}">
                ${sign}$${amtUSD.toFixed(2)} <br><span style="font-size:10px; color:#64748b;">${sign}${lbpVal} LBP</span>
              </div>
            </div>`;
        }
      });

      const tNet = tInc - tExp;

      document.getElementById('house-inc-usd').innerText = '$' + tInc.toFixed(2);
      document.getElementById('house-inc-lbp').innerText = Math.round(tInc * rate).toLocaleString() + ' LBP';
      document.getElementById('house-exp-usd').innerText = '$' + tExp.toFixed(2);
      document.getElementById('house-exp-lbp').innerText = Math.round(tExp * rate).toLocaleString() + ' LBP';

      const netElem = document.getElementById('house-net-usd');
      netElem.innerText = '$' + tNet.toFixed(2);
      netElem.className = 'stat-usd ' + (tNet >= 0 ? 'income' : 'expense');
      document.getElementById('house-net-lbp').innerText = Math.round(tNet * rate).toLocaleString() + ' LBP';

      document.getElementById('house-report').innerHTML = todayHtml || 'No records for today.';
    }

    function shareHouseWhatsApp() {
      const rate = parseArabicNumber(document.getElementById('exchange-rate').value) || 90000;
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      let tInc = 0, tExp = 0;
      let msg = `🏠 *House Daily Report*\n📅 *Date:* ${todayStr}\n---------------------\n`;

      globalHouseData.forEach(item => {
        if (item.entry_date === todayStr) {
          const amtUSD = Number(item.amount);
          const isIncome = item.category === 'income';
          if (isIncome) tInc += amtUSD;
          else tExp += amtUSD;

          const lbpVal = Math.round(amtUSD * rate).toLocaleString();
          const sign = isIncome ? '+' : '-';
          msg += `${sign} ${item.notes}: ${lbpVal} LBP ($${amtUSD.toFixed(2)})\n`;
        }
      });

      const tNet = tInc - tExp;
      msg += `---------------------\n`;
      msg += `💰 *Net Balance:* ${Math.round(tNet * rate).toLocaleString()} LBP ($${tNet.toFixed(2)})\n`;

      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    loadHouseData();
  </script>
</body>
</html>
